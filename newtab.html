<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="newtab-themes.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <button
      id="settings-toggle"
      class="icon-button settings-toggle"
      type="button"
      aria-label="Open settings"
      aria-expanded="false"
      aria-controls="settings-panel"
    >
      <span aria-hidden="true">⚙</span>
    </button>

    <main class="shell">
      <div
        id="theme-customize-popup"
        class="popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="popup-title"
        hidden
      >
        <div class="popup-content">
          <h2 id="popup-title">Customize Theme</h2>
          <div class="popup-body">
            <label class="field-label" for="theme-hue-slider">Hue</label>
            <div class="slider-container">
              <input id="theme-hue-slider" type="range" min="0" max="359" value="0" />
              <span id="theme-hue-value">0 deg</span>
            </div>
            <div class="popup-actions">
              <button id="theme-apply-btn" class="save-button" type="button">Apply</button>
              <button
                id="theme-cancel-btn"
                class="icon-button popup-close-button"
                type="button"
                aria-label="Close popup"
              >
                <span aria-hidden="true">×</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <section
        id="hero-panel"
        class="panel hero-panel"
        aria-label="Current time, bookmarks, and payday countdown"
      >
        <div class="hero-content">
          <h1 id="clock" class="clock" aria-live="polite">00:00:00</h1>
          <p id="date-label" class="date-label">Loading date…</p>

          <section id="bookmarks-section" class="bookmarks-section" aria-label="Bookmarks">
            <p class="section-title">Bookmarks</p>
            <div id="bookmarks-root-links" class="bookmark-link-list" aria-label="Top-level bookmarks"></div>
            <div id="bookmarks-folders" class="bookmark-folder-grid" aria-label="Bookmark folders"></div>
            <p id="bookmarks-message" class="bookmarks-message" aria-live="polite"></p>
          </section>

          <p id="payday-status" class="payday-status">0 days till payday</p>
          <p id="payday-target" class="payday-target">Next payday: --</p>

          <section
            id="countdown"
            class="countdown"
            aria-label="Detailed payday countdown"
            hidden
          >
            <article class="countdown-card">
              <span id="days-value" class="countdown-value">0</span>
              <span class="countdown-label">Days</span>
            </article>
            <article class="countdown-card">
              <span id="hours-value" class="countdown-value">0</span>
              <span class="countdown-label">Hours</span>
            </article>
            <article class="countdown-card">
              <span id="minutes-value" class="countdown-value">0</span>
              <span class="countdown-label">Minutes</span>
            </article>
            <article id="seconds-card" class="countdown-card">
              <span id="seconds-value" class="countdown-value">0</span>
              <span class="countdown-label">Seconds</span>
            </article>
          </section>
        </div>
      </section>

      <aside
        id="settings-panel"
        class="panel settings-panel"
        aria-label="Payday settings"
        hidden
      >
        <p class="settings-title">Settings</p>
        <form id="settings-form" class="settings-form">
          <label class="field-label" for="payday-input">Recurring payday day</label>
          <div class="field-row">
            <input
              id="payday-input"
              class="payday-input"
              name="payday"
              type="number"
              min="1"
              max="31"
              inputmode="numeric"
              required
            />
            <button class="save-button" type="submit">Save</button>
          </div>
          <p class="helper-text">
            Values above the last day of a month automatically clamp to that month’s final valid date.
          </p>
          <div class="clock-size-control" aria-label="Clock font size controls">
            <span class="field-label">Clock size</span>
            <div class="size-control-row">
              <button
                id="clock-size-down"
                class="icon-button size-button"
                type="button"
                aria-label="Decrease clock size"
              >
                -
              </button>
              <span id="clock-size-label" class="size-label" aria-live="polite">100%</span>
              <button
                id="clock-size-up"
                class="icon-button size-button"
                type="button"
                aria-label="Increase clock size"
              >
                +
              </button>
            </div>
          </div>
          <button
            id="seconds-toggle"
            class="icon-button theme-toggle"
            type="button"
            aria-label="Toggle seconds visibility"
          >
            Hide seconds
          </button>
          <button
            id="theme-toggle"
            class="icon-button theme-toggle"
            type="button"
            aria-label="Toggle dark mode"
          >
            Dark mode
          </button>
          <div class="palette-nav" aria-label="Theme navigation">
            <button
              id="palette-prev"
              class="icon-button theme-toggle"
              type="button"
              aria-label="Previous theme"
            >
              Previous
            </button>
            <button
              id="palette-next"
              class="icon-button theme-toggle"
              type="button"
              aria-label="Next theme"
            >
              Next
            </button>
            <button
              id="randomize-theme"
              class="icon-button theme-toggle"
              type="button"
              aria-label="Randomize theme colors"
            >
              Randomize
            </button>
            <button
              id="customize-theme"
              class="icon-button theme-toggle"
              type="button"
              aria-label="Customize theme"
            >
              Customize
            </button>
          </div>
          <p id="save-message" class="save-message" aria-live="polite"></p>
        </form>
      </aside>
    </main>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
